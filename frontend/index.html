<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List - Gestor de Tareas</title>
    <link rel="stylesheet" href="src/assets/styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-left">
                <span class="menu-icon">&#9776;</span>
                <h1>Task List</h1>
            </div>
            <button id="btn-new" class="btn-new" onclick="toggleListForm()">+ New</button>
        </header>

        <form id="list-form" class="list-form hidden" onsubmit="handleCreateList(event)">
            <input type="text" id="input-list-title" placeholder="Titulo de la lista" required maxlength="200">
            <textarea id="input-list-desc" placeholder="Descripcion (opcional)" rows="2"></textarea>
            <div class="form-actions">
                <button type="submit" class="btn-save">Guardar</button>
                <button type="button" class="btn-cancel" onclick="toggleListForm()">Cancelar</button>
            </div>
        </form>

        <div id="task-lists-container" class="task-lists-container">
            <!-- Las listas se renderizan aqui -->
        </div>
    </div>

    <script src="src/services/api_service.js"></script>
    <script src="src/components/task_card.js"></script>
    <script src="src/pages/main.js"></script>
</body>
</html>
